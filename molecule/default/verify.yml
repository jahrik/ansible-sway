---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check sway binary
      ansible.builtin.stat:
        path: /usr/bin/sway
      register: sway_bin

    - name: Assert sway is installed
      ansible.builtin.assert:
        that: sway_bin.stat.exists
        fail_msg: "sway binary not found at /usr/bin/sway"

    - name: Check sway config directory
      ansible.builtin.stat:
        path: ~/.config/sway
      register: sway_dir

    - name: Assert sway config directory exists
      ansible.builtin.assert:
        that: sway_dir.stat.exists and sway_dir.stat.isdir
        fail_msg: "~/.config/sway directory not found"

    - name: Check sway config file
      ansible.builtin.stat:
        path: ~/.config/sway/config
      register: sway_cfg

    - name: Assert sway config exists
      ansible.builtin.assert:
        that: sway_cfg.stat.exists
        fail_msg: "~/.config/sway/config not found"

    - name: Check sway background image
      ansible.builtin.stat:
        path: ~/.config/sway/background.jpg
      register: sway_bg

    - name: Assert background image exists
      ansible.builtin.assert:
        that: sway_bg.stat.exists
        fail_msg: "~/.config/sway/background.jpg not found"

- name: Uninstall
  hosts: all
  gather_facts: false
  tasks:
    - name: "Include jahrik.sway with install: false"
      ansible.builtin.include_role:
        name: "jahrik.sway"
      vars:
        install: false

- name: Verify uninstall
  hosts: all
  gather_facts: false
  tasks:
    - name: Check sway binary absent
      ansible.builtin.stat:
        path: /usr/bin/sway
      register: sway_bin_removed

    - name: Assert sway binary is absent
      ansible.builtin.assert:
        that: not sway_bin_removed.stat.exists
        fail_msg: "sway binary still present at /usr/bin/sway after uninstall"

    - name: Check sway config directory absent
      ansible.builtin.stat:
        path: ~/.config/sway
      register: sway_dir_removed

    - name: Assert sway config directory is absent
      ansible.builtin.assert:
        that: not sway_dir_removed.stat.exists
        fail_msg: "~/.config/sway directory still present after uninstall"
