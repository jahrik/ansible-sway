---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check sway binary
      ansible.builtin.stat:
        path: /usr/bin/sway
      register: sway_bin

    - name: Assert sway is installed
      ansible.builtin.assert:
        that: sway_bin.stat.exists
        fail_msg: "sway binary not found at /usr/bin/sway"

    - name: Check dunst binary
      ansible.builtin.stat:
        path: /usr/bin/dunst
      register: dunst_bin

    - name: Assert dunst is installed
      ansible.builtin.assert:
        that: dunst_bin.stat.exists

    - name: Run dunst --version
      ansible.builtin.command: dunst --version
      register: dunst_version
      changed_when: false

    - name: Assert dunst version output
      ansible.builtin.assert:
        that: "'dunst' in dunst_version.stdout | lower"

    - name: Check waybar binary
      ansible.builtin.stat:
        path: /usr/bin/waybar
      register: waybar_bin

    - name: Assert waybar is installed
      ansible.builtin.assert:
        that: waybar_bin.stat.exists

    - name: Run waybar --version
      ansible.builtin.command: waybar --version
      register: waybar_version
      changed_when: false
      failed_when: false

    - name: Assert waybar version output
      ansible.builtin.assert:
        that: "'waybar' in waybar_version.stdout | lower"
      when: waybar_version.rc == 0

    - name: Check sway config directory
      ansible.builtin.stat:
        path: ~/.config/sway
      register: sway_dir

    - name: Assert sway config directory exists
      ansible.builtin.assert:
        that: sway_dir.stat.exists and sway_dir.stat.isdir
        fail_msg: "~/.config/sway directory not found"

    - name: Check sway config file
      ansible.builtin.stat:
        path: ~/.config/sway/config
      register: sway_cfg

    - name: Assert sway config exists
      ansible.builtin.assert:
        that: sway_cfg.stat.exists
        fail_msg: "~/.config/sway/config not found"

    - name: Check sway background image
      ansible.builtin.stat:
        path: ~/.config/sway/background.jpg
      register: sway_bg

    - name: Assert background image exists
      ansible.builtin.assert:
        that: sway_bg.stat.exists
        fail_msg: "~/.config/sway/background.jpg not found"
